name: Performance regression attribution

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline source ref and declared engine
        default: release-0.0.62
        required: true
        type: string
      candidate:
        description: Candidate source ref and declared engine
        default: main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      baseline: ${{ steps.refs.outputs.baseline }}
      candidate: ${{ steps.refs.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: refs
        env:
          BASELINE_REF: ${{ inputs.baseline }}
          CANDIDATE_REF: ${{ inputs.candidate }}
        run: |
          baseline=$(git rev-parse --verify --end-of-options "${BASELINE_REF}^{commit}")
          candidate=$(git rev-parse --verify --end-of-options "${CANDIDATE_REF}^{commit}")
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

  diagnose:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [controlled, live]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
      - run: python -m pip install -r benchmark/requirements.txt
      - name: Compare all three arms on one runner
        env:
          BASELINE: ${{ needs.resolve.outputs.baseline }}
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
          MODE: ${{ matrix.mode }}
        run: >-
          python -m benchmark.diagnostics.regression_attribution
          --baseline "$BASELINE" --candidate "$CANDIDATE"
          --output benchmark/results/local/attribution
          --mode "$MODE" --rounds 6 --profile-repeats 100
          --network-label "GitHub ubuntu-24.04; $MODE attribution"
      - name: Publish development summaries
        if: always()
        run: find benchmark/results/local/attribution -name results.md -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attribution-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark/results/local/attribution/attribution.json
            benchmark/results/local/attribution/experiment.json
            benchmark/results/local/attribution/*/results.json
            benchmark/results/local/attribution/*/results.md
            benchmark/results/local/attribution/*/results_summary.json
            benchmark/results/local/attribution/*/dependencies.lock
            benchmark/results/local/attribution/*/install.log
            benchmark/results/local/attribution/harness-dependencies.lock
            benchmark/results/local/attribution/harness/benchmark/**/*.py
            benchmark/results/local/attribution/harness/benchmark/requirements.txt
          retention-days: 30
