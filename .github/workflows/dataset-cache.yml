  pull_request:
    paths:
      - "defeatbeta_api/client/dataset_cache_fs.py"
      - "defeatbeta_api/client/duckdb_client.py"
      - "defeatbeta_api/client/duckdb_conf.py"
      - "defeatbeta_api/client/hugging_face_client.py"
      - "defeatbeta_api/client/shared_resources.py"
      - "defeatbeta_api/client/http_pool.py"
      - "defeatbeta_api/client/http_runtime.py"
      - "defeatbeta_api/client/http2_receive.py"
      - "test/test_http2_receive.py"
      - "test/test_duckdb_wait_repro.py"
      - "test/test_duckdb_cpu_comparison.py"
      - "test/test_http_runtime.py"
      - "test/test_http_pool.py"
      - "defeatbeta_api/client/hf_session.py"
      - "test/test_shared_resources.py"
      - "test/http2_peer.py"
      - "test/proxy_peer.py"
