      - "benchmark/**"
      - "test/test_benchmark_publication.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "test/test_dataset_cache_fs.py"
      - "test/test_duckdb_client.py"
      - "test/test_resolve_direct.py"
      - "test/test_benchmark.py"
      - "test/test_e2e_*.py"
      - "test/test_test_collection.py"
      - "test/test_all_tickers.py"
      - "test/test_ticker.py"
      - "test/test_ticker_multithreaded.py"
      - "test/test_report.py"
      - ".github/workflows/dataset-cache.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest test.test_dataset_cache_fs test.test_resolve_direct test.test_benchmark test.test_duckdb_client.TestDuckDBClient test.test_test_collection test.test_shared_resources test.test_http_pool test.test_http_runtime test.test_http_protocol test.test_http2_receive test.test_shared_query_benchmark test.test_connection_timeline test.test_http_pool_mixed test.test_cache_timeline test.test_http2_stream_timeline test.test_duckdb_wait_repro test.test_duckdb_cpu_comparison test.test_cdn_idle test.test_cdn_active -q
      - run: python -m unittest test.test_benchmark_publication -q
      - run: python -m unittest test.test_e2e_benchmark test.test_e2e_execution -q
      - name: Benchmark fixture TLS integration
        if: runner.os == 'Linux'
        env:
          DEFEATBETA_RUN_BENCHMARK_TLS_TESTS: "1"
        run: |
          python -m pip install -r benchmark/requirements.txt
          python -m unittest test.test_benchmark.TestBenchmarkTLS test.test_e2e_integration -v
      - name: Unix packet diagnostic unit tests
        if: runner.os != 'Windows'
        run: python -m unittest test.test_tcp_keepalive_capture -q

  network-smoke:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest test.test_dataset_cache_fs.TestDirectHttp2NetworkSmoke -q
        env:
          DEFEATBETA_RUN_DIRECT_HTTP2_TESTS: "1"
      - run: python -m unittest test.test_duckdb_client.TestDuckDBClientIntegration -q
      - run: python -m unittest test.test_all_tickers.TestRepresentativeTickers -q
        env:
          DEFEATBETA_RUN_NETWORK_TESTS: "1"
      - run: python -m unittest test.test_ticker_multithreaded -q
        env:
          DEFEATBETA_RUN_NETWORK_TESTS: "1"
