name: Dataset cache filesystem tests

on:
  workflow_dispatch:
  push:
    paths:
      - "defeatbeta_api/**"
      - "test/**"
      - "benchmark/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/dataset-cache.yml"
  pull_request:
    paths:
      - "defeatbeta_api/**"
      - "test/**"
      - "benchmark/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/dataset-cache.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Product unit tests
        run: >-
          python -m unittest -q
          test.test_dataset_cache_fs test.test_resolve_direct test.test_duckdb_client.TestDuckDBClient
          test.test_extent_retention test.test_shared_resources test.test_http_pool test.test_http_runtime
          test.test_http_protocol test.test_http2_receive test.test_query_materialization
          test.test_catalog_reuse test.test_industry_currency test.test_industry_alignment
          test.test_industry_market_cap test.test_test_collection
      - name: Benchmark harness unit tests
        run: >-
          python -m unittest -q
          test.test_benchmark test.test_shared_query_benchmark test.test_e2e_benchmark
          test.test_e2e_execution test.test_e2e_probe test.test_e2e_concurrency
          test.test_e2e_integration.TestWorkerFailures
      - name: Benchmark fixture TLS integration
        if: runner.os == 'Linux'
        env:
          DEFEATBETA_RUN_BENCHMARK_TLS_TESTS: "1"
        run: |
          python -m pip install -r benchmark/requirements.txt
          python -m unittest test.test_benchmark.TestBenchmarkTLS test.test_e2e_integration -v

  network-smoke:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest test.test_dataset_cache_fs.TestDirectHttp2NetworkSmoke -q
        env:
          DEFEATBETA_RUN_DIRECT_HTTP2_TESTS: "1"
      - run: python -m unittest test.test_duckdb_client.TestDuckDBClientIntegration -q
      - run: python -m unittest test.test_all_tickers.TestRepresentativeTickers -q
        env:
          DEFEATBETA_RUN_NETWORK_TESTS: "1"
      - run: python -m unittest test.test_ticker_multithreaded -q
        env:
          DEFEATBETA_RUN_NETWORK_TESTS: "1"
