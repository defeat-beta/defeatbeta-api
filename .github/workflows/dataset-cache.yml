name: Dataset cache filesystem tests

on:
  workflow_dispatch:
  push:
    paths:
      - "defeatbeta_api/client/dataset_cache_fs.py"
      - "defeatbeta_api/client/duckdb_client.py"
      - "defeatbeta_api/client/duckdb_conf.py"
      - "defeatbeta_api/client/hugging_face_client.py"
      - "defeatbeta_api/data/ticker.py"
      - "defeatbeta_api/data/transcripts.py"
      - "defeatbeta_api/utils/util.py"
      - "benchmark/benchmark.py"
      - "benchmark/report.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "test/test_dataset_cache_fs.py"
      - "test/test_duckdb_client.py"
      - "test/test_resolve_direct.py"
      - "test/test_benchmark.py"
      - "test/test_test_collection.py"
      - "test/test_all_tickers.py"
      - "test/test_ticker.py"
      - "test/test_ticker_multithreaded.py"
      - "test/test_report.py"
      - ".github/workflows/dataset-cache.yml"
  pull_request:
    paths:
      - "defeatbeta_api/client/dataset_cache_fs.py"
      - "defeatbeta_api/client/duckdb_client.py"
      - "defeatbeta_api/client/duckdb_conf.py"
      - "defeatbeta_api/client/hugging_face_client.py"
      - "defeatbeta_api/data/ticker.py"
      - "defeatbeta_api/data/transcripts.py"
      - "defeatbeta_api/utils/util.py"
      - "benchmark/benchmark.py"
      - "benchmark/report.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "test/test_dataset_cache_fs.py"
      - "test/test_duckdb_client.py"
      - "test/test_resolve_direct.py"
      - "test/test_benchmark.py"
      - "test/test_test_collection.py"
      - "test/test_all_tickers.py"
      - "test/test_ticker.py"
      - "test/test_ticker_multithreaded.py"
      - "test/test_report.py"
      - ".github/workflows/dataset-cache.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest test.test_dataset_cache_fs test.test_resolve_direct test.test_benchmark test.test_duckdb_client.TestDuckDBClient test.test_test_collection -q

  network-smoke:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest test.test_duckdb_client.TestDuckDBClientIntegration -q
      - run: python -m unittest test.test_all_tickers.TestRepresentativeTickers -q
        env:
          DEFEATBETA_RUN_NETWORK_TESTS: "1"
      - run: python -m unittest test.test_ticker_multithreaded -q
        env:
          DEFEATBETA_RUN_NETWORK_TESTS: "1"
