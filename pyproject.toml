[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defeatbeta-api"
dynamic = ["version"]
description = "An open-source alternative to Yahoo Finance's market data APIs with higher reliability."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "zxh2010", email = "5077921+zxh2010@users.noreply.github.com"}
]
dependencies = [
    "duckdb == 1.5.3",
    "pandas >= 3.0.1",
    "requests[socks] >= 2.33.0",
    "psutil >= 7.0.0",
    "pyfiglet >= 1.0.2",
    "urllib3 >= 2.6.3",
    "fsspec >= 2025.1.0",
    "httpx[http2,socks] >= 0.28.1, < 1",
    "tabulate >= 0.9.0",
    "numpy >= 2.2.5",
    "rich >= 14.0.0",
    "openai >= 1.106.1",
    "pysbd == 0.3.4",
    "ipython>=8.0.0,<=8.37.0",
    "matplotlib>=3.10.7",
    "openpyxl>=3.1.5"
]

[tool.setuptools.dynamic]
version = {attr = "defeatbeta_api.__version__.__version__"}

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["defeatbeta_api*"]
namespaces = false

[tool.setuptools.package-data]
"defeatbeta_api.data.sql" = ["*.sql"]
"defeatbeta_api.data.template" = ["*.json", "*.md"]
"defeatbeta_api.reports" = ["*.html"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc"]

[project.urls]
"Homepage" = "https://github.com/defeat-beta/defeatbeta-api"
"Bug Tracker" = "https://github.com/defeat-beta/defeatbeta-api/issues"
